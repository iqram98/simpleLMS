<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      #splash-awal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f6f9;
      }
      @media (prefers-color-scheme: dark) {
        #splash-awal {
          background: #12151c;
        }
        #splash-awal img {
          background: #fff;
          padding: 2px;
          border-radius: 14px;
        }
      }
      #splash-awal img {
        animation: d 1.4s ease-in-out infinite;
      }
      @keyframes d {
        50% {
          transform: scale(0.9);
          opacity: 0.7;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash-awal img {
          animation: none;
        }
      }
    </style>
    <meta
      name="description"
      content="Kelas online untuk guru dan siswa: materi, ujian, tugas, dan forum dalam satu tempat. Masuk dengan akun Google."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kelas online untuk guru dan siswa" />
    <meta property="og:description" content="Materi, ujian, tugas, dan forum dalam satu tempat. Masuk dengan akun Google." />
    <meta property="og:image" content="__SITE_URL__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Learn Hub</title>
  </head>
  <body>
    <div id="root">
      <div id="splash-awal" aria-hidden="true"><img src="/logo-192.png" width="64" height="64" alt="" /></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
